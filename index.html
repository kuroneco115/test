<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#e9edf0;font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px}
header,#hud{width:min(1000px,100%);display:flex;justify-content:space-between;gap:8px;align-items:center}
header{color:#9eabb7;font-size:12px}header b{font-size:21px;letter-spacing:.28em;color:#f3f5f6}
#frame{position:relative;width:min(1000px,100%);aspect-ratio:16/10;max-height:72vh;background:#111922;border:1px solid #34414b;border-radius:8px;overflow:hidden;box-shadow:0 18px 70px #000b}
canvas{display:block;width:100%;height:100%}
#hud{font-size:12px;color:#c1ccd5}#hint{font-size:11px;color:#7f8b96;text-align:center}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#05090ddd}
.panel{max-width:560px}.panel h1{font-size:clamp(38px,8vw,62px);letter-spacing:.28em;margin:0 0 10px}.panel p{font-size:13px;line-height:1.85;color:#c1cbd3}
button{background:#dce5e9;color:#101820;border:1px solid #aebcc5;border-radius:6px;padding:12px 24px;font-weight:800}
#mobile{display:none;position:absolute;inset:auto 10px 10px;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:3px;pointer-events:auto}
.pad button,.actions button{padding:0;width:42px;height:42px;background:#17232bdc;color:white;border-color:#aab8c477;font-size:17px}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.actions{display:flex;gap:5px;pointer-events:auto}.actions button{width:58px;height:50px;font-size:11px}
@media(pointer:coarse){#mobile{display:flex}#hint{display:none}#frame{max-height:68vh}}
</style>
</head>
<body>
<div id="app">
<header><b>test</b><span>FIELD 01 — ABNORMAL SCHOOL</span></header>
<div id="frame">
<canvas id="game" width="960" height="600"></canvas>
<div id="overlay"><div class="panel"><h1>test</h1><p>夜の高校。校内放送が途切れた瞬間、見慣れた校舎は出口のない迷宮へ変わった。<br>各階に隠された記録を集め、校舎から脱出しよう。</p><p>PC：WASD / 矢印キーで移動・SHIFTで走る・Eで調べる<br>スマホ：画面のパッド・調べるボタン</p><button id="start">ゲーム開始</button></div></div>
<div id="mobile"><div class="pad">
<button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button>
</div><div class="actions"><button id="run">走る</button><button id="act">調べる</button></div></div>
</div>
<div id="hud"><span id="objective">記録 0 / 4</span><span id="floor">1F 校舎</span><span id="state">探索中</span><span id="stamina">体力 ■■■</span></div>
<div id="hint">WASD / 矢印キー：移動　SHIFT：走る　E：調べる・階段を使う</div>
</div>
<script>
(()=>{
const cv=document.getElementById('game'),c=cv.getContext('2d');
const TILE=48,MAP=[
"####################",
"#....#.............#",
"#....#..####..###..#",
"#....#..#..#..#.....#",
"#.......#..#..#..##.#",
"###.#####..#..#..#..#",
"#...#......#.....#..#",
"#...#.######.#####..#",
"#......#...........##",
"#.####.#.#######.#..#",
"#....#.#.....#...#..#",
"###..#.#####.#.###..#",
"#....#.......#......#",
"#.##########.#####..#",
"#..................E#",
"####################"
];
const floors=[
{name:'1F 校舎',start:[2.5,2.5],exit:[18.5,14.5],stairs:[16.5,2.5],note:[8.5,3.5],key:[4.5,12.5]},
{name:'2F 特別教室',start:[16.5,2.5],exit:[2.5,2.5],stairs:[3.5,13.5],note:[15.5,8.5],key:[5.5,3.5]},
{name:'3F 図書室',start:[3.5,13.5],exit:[18.5,14.5],stairs:[17.5,3.5],note:[9.5,10.5],key:[15.5,12.5]},
{name:'地下・旧校舎',start:[17.5,3.5],exit:[2.5,2.5],stairs:[2.5,13.5],note:[5.5,8.5],key:[14.5,6.5]}
];
let floor=0,player,monster,records=[],keyFound=[],stamina=100,noise=0,game='menu',near='';
const down={},audio={ctx:null,osc:null};
const cols=MAP[0].length,rows=MAP.length;
function wall(x,y){let xx=Math.floor(x/TILE),yy=Math.floor(y/TILE);return yy<0||xx<0||yy>=rows||xx>=cols||MAP[yy][xx]==='#'}
function move(o,dx,dy){let nx=o.x+dx,ny=o.y+dy;if(!wall(nx+Math.sign(dx)*o.r,o.y)&&!wall(nx,o.y+o.r*.65)&&!wall(nx,o.y-o.r*.65))o.x=nx;if(!wall(o.x,ny+Math.sign(dy)*o.r)&&!wall(o.x+o.r*.65,ny)&&!wall(o.x-o.r*.65,ny))o.y=ny}
function initFloor(i){floor=i;let f=floors[i];player={x:f.start[0]*TILE,y:f.start[1]*TILE,r:10,face:0,step:0};monster={x:(i%2?4.5:17.5)*TILE,y:(i%2?11.5:12.5)*TILE,r:13,alert:0,phase:0};records[i]=records[i]||false;keyFound[i]=keyFound[i]||false;near='';hud()}
function reset(){records=[false,false,false,false];keyFound=[false,false,false,false];stamina=100;noise=0;initFloor(0);game='play';document.getElementById('overlay').style.display='none';startAudio()}
function hud(){document.getElementById('objective').textContent=`記録 ${records.filter(Boolean).length} / 4　鍵 ${keyFound.filter(Boolean).length}/4`;document.getElementById('floor').textContent=floors[floor].name;document.getElementById('stamina').textContent='体力 '+('■'.repeat(Math.ceil(stamina/34))||'□');document.getElementById('state').textContent=near||'探索中'}
function startAudio(){try{if(!audio.ctx){audio.ctx=new(window.AudioContext||window.webkitAudioContext)();audio.osc=audio.ctx.createOscillator();let gain=audio.ctx.createGain();audio.osc.type='sine';audio.osc.frequency.value=48;gain.gain.value=.018;audio.osc.connect(gain);gain.connect(audio.ctx.destination);audio.osc.start()}audio.ctx.resume()}catch(e){}}
function beep(freq=440,dur=.12){try{let o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.ctx.currentTime+dur);o.connect(g);g.connect(audio.ctx.destination);o.start();o.stop(audio.ctx.currentTime+dur)}catch(e){}}
function interact(){if(game!=='play')return;let f=floors[floor],d=(p)=>Math.hypot(player.x-p[0]*TILE,player.y-p[1]*TILE);
 if(!records[floor]&&d(f.note)<45){records[floor]=true;beep(660);showToast('記録片を回収した');}
 else if(!keyFound[floor]&&d(f.key)<45){keyFound[floor]=true;beep(520);showToast('古い鍵を見つけた');}
 else if(d(f.stairs)<54){if(floor<3){initFloor(floor+1);beep(330);showToast('階層が変わった');}else showToast('階段は崩れていて通れない');}
 else if(d(f.exit)<54){if(records.every(Boolean)&&keyFound.every(Boolean)){game='clear';end('脱出成功','4つの記録と鍵を集め、校舎から脱出した。')}else showToast('出口は施錠されている。各階の記録と鍵が必要だ。');}
 else showToast('周囲には古い机とロッカーが並んでいる。');
 hud()}
let toast='',toastTime=0;function showToast(s){toast=s;toastTime=2.3;hud()}
function end(title,msg){let o=document.getElementById('overlay');o.style.display='flex';o.innerHTML=`<div class="panel"><h1 style="letter-spacing:.12em">${title}</h1><p>${msg}</p><button id="again">もう一度</button></div>`;document.getElementById('again').onclick=()=>{o.innerHTML='<div class="panel"><h1>test</h1><p>校舎に戻る。4つの記録と鍵を探そう。</p><button id="start2">ゲーム開始</button></div>';document.getElementById('start2').onclick=reset;};}
function update(dt){
 if(game!=='play')return;
 let dx=0,dy=0;if(down.ArrowLeft||down.a)dx--;if(down.ArrowRight||down.d)dx++;if(down.ArrowUp||down.w)dy--;if(down.ArrowDown||down.s)dy++;
 let moving=!!(dx||dy),l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
 let run=(down.Shift||down.run)&&stamina>0&&moving,speed=run?220:145;
 if(run){stamina=Math.max(0,stamina-30*dt);noise=Math.min(1,noise+dt*1.1)}else{stamina=Math.min(100,stamina+18*dt);noise=Math.max(0,noise-dt*.55)}
 if(moving){player.face=Math.atan2(dy,dx);player.step+=dt*(run?13:8);move(player,dx*speed*dt,dy*speed*dt)}
 let dist=Math.hypot(monster.x-player.x,monster.y-player.y);monster.alert=Math.max(noise,dist<250?1-dist/250:0);
 if(monster.alert>.06){let vx=player.x-monster.x,vy=player.y-monster.y,ll=Math.hypot(vx,vy)||1;move(monster,vx/ll*(68+monster.alert*38)*dt,vy/ll*(68+monster.alert*38)*dt)}
 else{monster.phase+=dt;let tx=(floor%2?4.5:17.5)*TILE+Math.cos(monster.phase*.4)*80,ty=11.5*TILE+Math.sin(monster.phase*.5)*65,vx=tx-monster.x,vy=ty-monster.y,ll=Math.hypot(vx,vy)||1;move(monster,vx/ll*28*dt,vy/ll*28*dt)}
 if(dist<player.r+monster.r+3){game='caught';end('発見された','背後から足音が迫り、校舎の闇に飲み込まれた。');}
 let f=floors[floor],dNote=Math.hypot(player.x-f.note[0]*TILE,player.y-f.note[1]*TILE),dKey=Math.hypot(player.x-f.key[0]*TILE,player.y-f.key[1]*TILE),dSt=Math.hypot(player.x-f.stairs[0]*TILE,player.y-f.stairs[1]*TILE),dEx=Math.hypot(player.x-f.exit[0]*TILE,player.y-f.exit[1]*TILE);
 near=dNote<45&&!records[floor]?'E：記録片を調べる':dKey<45&&!keyFound[floor]?'E：鍵を拾う':dSt<54?'E：階段を使う':dEx<54?'E：出口を調べる':'';
 if(toastTime>0)toastTime-=dt;hud();
}
function drawPixelPerson(x,y,step,face,isMonster=false){
 c.save();c.translate(Math.round(x),Math.round(y));
 if(isMonster){
  let sway=Math.sin(step*5)*2;c.fillStyle='#090b10';c.fillRect(-8,-13+sway,16,26);c.fillRect(-12,-7+sway,5,17);c.fillRect(7,-5-sway,5,18);c.fillRect(-7,11,5,13);c.fillRect(3,11,5,13);c.fillStyle='#d8e5df';c.fillRect(-5,-5,3,2);c.fillRect(3,-5,3,2);c.fillStyle='#29343a';c.fillRect(-5,-16,10,4);
 }else{
  // オリジナルの学生キャラクター：黒髪、青緑の制服、赤いバッグ
  let bob=Math.sin(step)*1.5,leg=Math.sin(step*2)*2;
  c.fillStyle='#111820';c.fillRect(-7,-16+bob,14,7);c.fillRect(-9,-12+bob,3,5);c.fillRect(6,-12+bob,3,5);
  c.fillStyle='#e4b99b';c.fillRect(-5,-10+bob,10,9);c.fillStyle='#151b24';c.fillRect(-6,-13+bob,12,4);c.fillRect(-7,-9+bob,3,4);
  c.fillStyle='#d6e0df';c.fillRect(-7,-2+bob,14,9);c.fillStyle='#315a62';c.fillRect(-7,0+bob,14,7);c.fillStyle='#a9c3c1';c.fillRect(-2,-1+bob,4,5);
  c.fillStyle='#b54e4e';c.fillRect(6,-1+bob,4,8);c.fillStyle='#18212a';c.fillRect(-6,8+bob,5,5+leg);c.fillRect(1,8+bob,5,5-leg);
  c.fillStyle='#d5dadd';c.fillRect(-7,12+bob+leg,6,2);c.fillRect(1,12+bob-leg,6,2);
 }
 c.restore();
}
function draw(){
 c.fillStyle='#101820';c.fillRect(0,0,960,600);
 let camX=Math.max(0,Math.min(cols*TILE-960,player.x-480)),camY=Math.max(0,Math.min(rows*TILE-600,player.y-300));
 c.save();c.translate(-camX,-camY);
 for(let r=0;r<rows;r++)for(let x=0;x<cols;x++){let px=x*TILE,py=r*TILE;
 if(MAP[r][x]==='#'){c.fillStyle='#26333a';c.fillRect(px,py,TILE,TILE);c.fillStyle='#3b4749';c.fillRect(px+2,py+2,TILE-4,5);c.fillStyle='#1a242b';c.fillRect(px+4,py+10,TILE-8,TILE-14)}
 else{c.fillStyle=(r+x)%2?'#555e57':'#62695f';c.fillRect(px,py,TILE,TILE);c.strokeStyle='#70766d';c.strokeRect(px,py,TILE,TILE);
  if((r+x*2)%9===0){c.fillStyle='#3c4b4d';c.fillRect(px+8,py+8,5,30);c.fillStyle='#9b9b83';c.fillRect(px+10,py+12,2,2)}
  if((r*5+x)%17===0){c.fillStyle='#39464a';c.fillRect(px+12,py+7,24,8);c.fillRect(px+14,py+15,20,3)}
 }}
 // 教室の机・ロッカー風のドット装飾
 for(let r=1;r<rows-1;r++)for(let x=1;x<cols-1;x++)if(MAP[r][x]==='.'&&(r*11+x*7)%23===0){c.fillStyle='#34434a';c.fillRect(x*TILE+13,r*TILE+15,22,13);c.fillStyle='#7d887f';c.fillRect(x*TILE+15,r*TILE+17,18,2)}
 let f=floors[floor];
 function item(pos,color,label){c.fillStyle=color;c.fillRect(pos[0]*TILE-8,pos[1]*TILE-8,16,16);c.fillStyle='#e8eee8';c.font='9px sans-serif';c.fillText(label,pos[0]*TILE-9,pos[1]*TILE-14)}
 if(!records[floor])item(f.note,'#b9e4dc','LOG');if(!keyFound[floor])item(f.key,'#d4b56c','KEY');item(f.stairs,'#647f91','STAIR');item(f.exit,'#72aa91','EXIT');
 drawPixelPerson(monster.x,monster.y,monster.phase,0,true);drawPixelPerson(player.x,player.y,player.step,player.face);
 c.restore();
 // flashlight / darkness
 c.fillStyle='rgba(1,4,9,.88)';c.fillRect(0,0,960,600);let px=player.x-camX,py=player.y-camY;
 c.globalCompositeOperation='destination-out';let g=c.createRadialGradient(px,py,24,px,py,240);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.7,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(px,py,240,0,Math.PI*2);c.fill();c.globalCompositeOperation='source-over';
 let vg=c.createRadialGradient(480,300,100,480,300,560);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=vg;c.fillRect(0,0,960,600);
 if(monster.alert>.3){for(let i=0;i<28;i++){c.fillStyle=`rgba(210,230,225,${monster.alert*.07})`;c.fillRect(Math.random()*960,Math.random()*600,Math.random()*30+3,1)}}
 if(toastTime>0){c.fillStyle='#e4eee9';c.font='16px sans-serif';c.textAlign='center';c.fillText(toast,480,50);c.textAlign='left'}
}
let last=0;function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('start').onclick=reset;document.getElementById('act').onclick=interact;document.getElementById('run').onpointerdown=()=>down.run=true;document.getElementById('run').onpointerup=()=>down.run=false;document.getElementById('run').onpointercancel=()=>down.run=false;
window.addEventListener('keydown',e=>{down[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact()});
window.addEventListener('keyup',e=>down[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();down[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>down[k]=false))});
initFloor(0);game='menu';requestAnimationFrame(loop);
})();
</script>
</body>
</html>
