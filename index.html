<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b0d">
<title>test — DARK SCHOOL UPDATE 03</title>
<style>
:root{color-scheme:dark;--ink:#e5eee9;--muted:#9aaca5;--panel:#101a1d}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b0d;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#182529,#06090b 75%)}
#app{width:min(1100px,100vw);height:min(900px,100dvh);display:flex;flex-direction:column;padding:7px;gap:6px}
header{display:flex;justify-content:space-between;align-items:center;min-height:22px;color:#9aaea6;font-size:10px;letter-spacing:.18em}
header strong{font-size:15px;letter-spacing:.3em;color:#e8f0eb}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid #52635e;border-radius:8px;background:#111a1b;box-shadow:0 15px 55px #000c}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#hud{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;font-size:11px;color:#d1ddd6;min-height:27px}
#objective{font-weight:700;color:#d7e9df}
#hint{font-size:10px;text-align:center;color:#9aaca5;min-height:15px}
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:#050a0ceF;overflow:auto}
.panel{width:min(650px,100%);max-height:100%;overflow:auto;padding:clamp(18px,4vw,32px);background:linear-gradient(145deg,#172426,#0a1114);border:1px solid #687b70;box-shadow:0 20px 80px #000d;text-align:center}
.kicker{font-size:10px;letter-spacing:.35em;color:#a8c4b5}
h1{font-size:clamp(36px,9vw,68px);letter-spacing:.32em;margin:7px 0;color:#edf5ee;text-shadow:0 0 28px #a9d2b555}
h2{font-size:22px;letter-spacing:.12em}
p{font-size:13px;line-height:1.9;color:#c2d0c8}
.small{font-size:10px;color:#92a49c}
button{border:1px solid #c1d5c8;background:#dce9df;color:#111b18;border-radius:8px;padding:13px 22px;font:inherit;font-weight:800;touch-action:manipulation}
button.alt{background:#1b2b2d;color:#e0eae2;border-color:#71877a}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#toast{position:absolute;z-index:4;top:12px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#0a1516ed;border:1px solid #849b8b;color:#e8f0e9;font-size:12px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#touch{display:none;position:absolute;z-index:3;left:10px;right:10px;bottom:10px;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:4px;pointer-events:auto}
.pad button,.actionsTouch button{width:58px;height:58px;padding:0;border:2px solid #b9d0c2aa;border-radius:12px;background:#102023ed;color:#eff7ef;font-size:20px;box-shadow:0 3px 12px #000b}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.actionsTouch{display:grid;grid-template-columns:repeat(2,66px);gap:6px;pointer-events:auto}
.actionsTouch button{width:66px;height:52px;font-size:12px}
@media(pointer:coarse){#touch{display:flex}}
@media(max-width:520px){#app{padding:4px;gap:4px}header{min-height:18px}header strong{font-size:13px}#hud{font-size:10px}#hint{font-size:9px}.pad{grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px}.pad button,.actionsTouch button{width:52px;height:52px}.actionsTouch{grid-template-columns:repeat(2,60px)}}
</style>
</head>
<body>
<div id="app">
<header><strong>test / DARK SCHOOL</strong><span>UPDATE 03 · NORMAL</span></header>
<div id="stage">
<canvas id="game" width="960" height="600" aria-label="ゲーム画面"></canvas>
<div id="toast"></div>
<div id="touch">
 <div class="pad">
  <button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button>
 </div>
 <div class="actionsTouch"><button data-action="run">走る</button><button data-action="interact">調べる</button><button data-action="light">ライト</button><button data-action="map">目的</button></div>
</div>
<div id="overlay">
 <div class="panel" id="panel">
  <div class="kicker">AN ORIGINAL SCHOOL HORROR GAME</div><h1>test</h1>
  <p>放課後の校舎に、帰れない夜が訪れた。<br>暗い部屋をひとつずつ調べ、出口を探そう。</p>
  <p class="small">移動：方向キー / WASD　調べる：E　走る：Shift　ライト：F<br>スマホ：画面の大きな操作ボタン</p>
  <div class="actions"><button id="start">NEW GAME</button></div>
  <p class="small">NORMAL · 探索と緊張感を重視した標準難易度</p>
 </div>
</div>
</div>
<div id="hud"><span id="roomName">普通教室</span><span id="objective">目的：教室を調べる</span><span id="status">電池 100%　体力 100%</span></div>
<div id="hint">部屋の中を調べ、光の届かない場所にも注意しよう。</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=600;
const $=id=>document.getElementById(id);
const keys={},touch={};
let state='title',roomId='class',player={x:480,y:410,dir:0,walk:0},battery=100,stamina=100,light=true,elapsed=0,toastTimer=0,noise=0,noiseCooldown=0,enemy=null,items={},found={},doorFlash=0,scare=0,ending='';
const TILE=40,ROOM={x:100,y:65,w:760,h:470};
const rooms={
 class:{name:'普通教室',wall:'#59615a',floor:'#55594e',doors:[{x:480,y:535,to:'hall',label:'廊下'}],props:['desks','blackboard','lockers'],item:'note',itemName:'机の中のメモ'},
 hall:{name:'東廊下',wall:'#59645e',floor:'#555b52',doors:[{x:480,y:65,to:'class',label:'教室'},{x:120,y:300,to:'science',label:'理科室'},{x:840,y:300,to:'library',label:'図書室'},{x:480,y:535,to:'music',label:'音楽室'}],props:['windows','lockers','clock'],item:null},
 science:{name:'理科室',wall:'#58625e',floor:'#555c54',doors:[{x:860,y:300,to:'hall',label:'廊下'}],props:['labtables','cabinets','sink'],item:'fuse',itemName:'予備ヒューズ'},
 library:{name:'図書室',wall:'#565e59',floor:'#50594f',doors:[{x:100,y:300,to:'hall',label:'廊下'}],props:['shelves','reading','ladder'],item:'key',itemName:'古い鍵'},
 music:{name:'音楽室',wall:'#5b5c54',floor:'#55564d',doors:[{x:480,y:65,to:'hall',label:'廊下'},{x:860,y:300,to:'art',label:'美術室'}],props:['piano','chairs','instruments'],item:'record',itemName:'放送室の記録'},
 art:{name:'美術室',wall:'#605d54',floor:'#57564d',doors:[{x:100,y:300,to:'music',label:'音楽室'},{x:860,y:300,to:'gym',label:'体育館'}],props:['easels','statues','shelves'],item:'seal',itemName:'地下扉の札'},
 gym:{name:'体育館',wall:'#565d59',floor:'#535b56',doors:[{x:100,y:300,to:'art',label:'美術室'},{x:480,y:535,to:'basement',label:'地下階段'}],props:['court','benches','curtains'],item:null},
 basement:{name:'地下旧校舎',wall:'#343e3d',floor:'#333d39',doors:[{x:480,y:65,to:'gym',label:'体育館'},{x:480,y:535,to:'exit',label:'非常口'}],props:['pipes','oldlockers','cracks'],item:'memory',itemName:'最後の記録'},
 exit:{name:'非常口',wall:'#47534d',floor:'#48534a',doors:[],props:['exitlight'],item:null}
};
const itemPos={class:[690,390],science:[260,390],library:[700,400],music:[250,390],art:[690,400],basement:[480,300]};
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastTimer=2.6}
function objective(){let t;
 if(!found.note)t='目的：教室でメモを探す';
 else if(!found.fuse)t='目的：理科室で予備ヒューズを探す';
 else if(!found.key)t='目的：図書室で古い鍵を探す';
 else if(!found.record)t='目的：音楽室で放送の記録を探す';
 else if(!found.seal)t='目的：美術室で地下扉の札を探す';
 else if(!found.memory)t='目的：地下旧校舎で最後の記録を探す';
 else t='目的：地下の非常口から脱出する';
 $('objective').textContent=t;
}
function status(){ $('roomName').textContent=rooms[roomId].name; $('status').textContent=`電池 ${Math.round(battery)}%　体力 ${Math.round(stamina)}%`;objective();}
function enter(id,from){roomId=id;player.x=from==='left'?150:from==='right'?810:480;player.y=from==='up'?110:from==='down'?490:300;player.walk=0;enemy={x:Math.random()<.5?170:790,y:Math.random()<.5?130:470,mode:'hidden',alert:0,phase:Math.random()*8,seen:0};doorFlash=.25;status();toast(rooms[id].name+'に入った');}
function start(){state='play';found={};battery=100;stamina=100;elapsed=0;light=true;enter('class');player.x=480;player.y=410;toast('教室を調べよう。メモが次の手がかりになる。');$('overlay').style.display='none';}
$('start').addEventListener('click',start);
function drawFloor(){
 const r=ROOM;ctx.fillStyle='#080e10';ctx.fillRect(0,0,W,H);ctx.fillStyle=rooms[roomId].wall;ctx.fillRect(r.x,r.y,r.w,r.h);
 ctx.fillStyle=rooms[roomId].floor;ctx.fillRect(r.x+10,r.y+10,r.w-20,r.h-20);
 // aged floor tiles
 for(let y=r.y+18;y<r.y+r.h-15;y+=40){for(let x=r.x+18;x<r.x+r.w-15;x+=40){ctx.strokeStyle='#d0d1b51a';ctx.lineWidth=1;ctx.strokeRect(x,y,40,40);if((x*3+y*7)%11===0){ctx.fillStyle='#202c281c';ctx.fillRect(x+8,y+9,8,3)}}}
 // wall trim and windows
 ctx.fillStyle='#303b38';ctx.fillRect(r.x,r.y,r.w,12);ctx.fillRect(r.x,r.y+r.h-12,r.w,12);ctx.fillRect(r.x,r.y,12,r.h);ctx.fillRect(r.x+r.w-12,r.y,12,r.h);
 if(roomId==='class'){for(let i=0;i<4;i++){let x=230+i*130;drawDesk(x,220);drawDesk(x,330)}drawBlackboard(480,105);drawLockers(145,185);}
 if(roomId==='hall'){for(let i=0;i<5;i++){ctx.fillStyle='#344a4b';ctx.fillRect(180+i*145,85,80,17);ctx.fillStyle='#9ebbb0';ctx.fillRect(186+i*145,89,68,9);drawLocker(180+i*145,490);}}
 if(roomId==='science'){for(let i=0;i<3;i++){drawLab(270+i*205,270);drawCabinet(200+i*250,130)}}
 if(roomId==='library'){for(let i=0;i<4;i++)drawShelf(220+i*155,220);drawDesk(480,440);drawShelf(480,130);}
 if(roomId==='music'){drawPiano(270,245);for(let i=0;i<3;i++)drawChair(480+i*90,300);drawDrums(690,200);drawBlackboard(480,105);}
 if(roomId==='art'){for(let i=0;i<3;i++)drawEasel(250+i*220,250);drawStatue(480,430);drawShelf(720,130);}
 if(roomId==='gym'){ctx.strokeStyle='#d9d2a044';ctx.lineWidth=4;ctx.strokeRect(250,155,460,300);ctx.beginPath();ctx.moveTo(480,155);ctx.lineTo(480,455);ctx.stroke();ctx.beginPath();ctx.arc(480,305,65,0,Math.PI*2);ctx.stroke();drawBench(180,475);drawBench(780,475);}
 if(roomId==='basement'){for(let i=0;i<6;i++){drawPipe(190+i*115,110);drawLocker(210+i*110,465)}}
 if(roomId==='exit'){ctx.fillStyle='#9a3c31';ctx.fillRect(430,110,100,230);ctx.fillStyle='#d6c89a';ctx.fillRect(448,125,64,16);ctx.fillStyle='#1d302b';ctx.fillRect(448,165,64,160);ctx.fillStyle='#d8e6ce';ctx.font='bold 18px sans-serif';ctx.fillText('EXIT',462,155);}
 // doors
 rooms[roomId].doors.forEach(d=>drawDoor(d));
}
function drawDesk(x,y){ctx.fillStyle='#252e2b';ctx.fillRect(x-34,y-18,68,38);ctx.fillStyle='#826c4f';ctx.fillRect(x-32,y-22,64,30);ctx.fillStyle='#a58c68';ctx.fillRect(x-28,y-19,56,23);ctx.fillStyle='#3b3028';ctx.fillRect(x-27,y+10,5,15);ctx.fillRect(x+22,y+10,5,15);ctx.fillStyle='#d5d1bc';ctx.fillRect(x-12,y-15,20,3);ctx.fillStyle='#718b81';ctx.fillRect(x+15,y-10,5,7)}
function drawBlackboard(x,y){ctx.fillStyle='#352d25';ctx.fillRect(x-130,y-23,260,48);ctx.fillStyle='#263c35';ctx.fillRect(x-124,y-18,248,37);ctx.strokeStyle='#9b8b68';ctx.strokeRect(x-124,y-18,248,37);ctx.fillStyle='#c9d4c4';ctx.font='13px serif';ctx.fillText('今日の日付',x-38,y+2)}
function drawLocker(x,y){ctx.fillStyle='#3c4945';ctx.fillRect(x-20,y-34,40,68);ctx.fillStyle='#65736a';ctx.fillRect(x-17,y-31,34,62);ctx.strokeStyle='#27312e';ctx.strokeRect(x-17,y-31,34,62);ctx.fillStyle='#c4bda0';ctx.fillRect(x+9,y-3,3,7);ctx.fillStyle='#34413c';ctx.fillRect(x-12,y-22,24,2)}
function drawLockers(x,y){for(let i=0;i<3;i++)drawLocker(x+i*45,y)}
function drawLab(x,y){ctx.fillStyle='#34413d';ctx.fillRect(x-53,y-24,106,55);ctx.fillStyle='#8c978a';ctx.fillRect(x-49,y-25,98,10);ctx.fillStyle='#3a554f';ctx.fillRect(x-40,y-13,15,22);ctx.fillStyle='#a7b9ac';ctx.fillRect(x-37,y-18,9,8);ctx.fillStyle='#6c8d84';ctx.fillRect(x+12,y-15,16,22);ctx.fillStyle='#b8c9bd';ctx.fillRect(x+15,y-20,10,8)}
function drawCabinet(x,y){ctx.fillStyle='#37433e';ctx.fillRect(x-32,y-35,64,70);ctx.fillStyle='#7e9085';ctx.fillRect(x-27,y-30,54,60);ctx.strokeStyle='#27342e';ctx.beginPath();ctx.moveTo(x,y-28);ctx.lineTo(x,y+28);ctx.stroke();ctx.fillStyle='#d0d7c9';ctx.fillRect(x-5,y-2,3,7)}
function drawShelf(x,y){ctx.fillStyle='#332b24';ctx.fillRect(x-43,y-75,86,150);ctx.fillStyle='#765f45';ctx.fillRect(x-39,y-70,78,140);for(let j=0;j<4;j++){ctx.fillStyle='#332d29';ctx.fillRect(x-38,y-48+j*34,76,4);for(let i=0;i<7;i++){ctx.fillStyle=['#7e5548','#536f67','#9a8055','#475e62'][((i+j*3)%4)];ctx.fillRect(x-35+i*10,y-66+j*34,8,17+((i+j)%3)*3)}}}
function drawChair(x,y){ctx.fillStyle='#384943';ctx.fillRect(x-14,y-12,28,24);ctx.fillStyle='#8a7656';ctx.fillRect(x-13,y-11,26,7);ctx.fillRect(x-11,y+11,4,13);ctx.fillRect(x+7,y+11,4,13)}
function drawPiano(x,y){ctx.fillStyle='#171b1a';ctx.fillRect(x-78,y-34,156,62);ctx.fillStyle='#343a35';ctx.fillRect(x-74,y-30,148,52);ctx.fillStyle='#d8d7c8';ctx.fillRect(x-65,y-25,130,17);for(let i=0;i<12;i++){ctx.fillStyle='#252a28';ctx.fillRect(x-61+i*10,y-25,5,11)}ctx.fillStyle='#171b1a';ctx.fillRect(x-60,y+23,8,30);ctx.fillRect(x+52,y+23,8,30)}
function drawDrums(x,y){ctx.fillStyle='#49574d';ctx.beginPath();ctx.arc(x,y,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c6c4b0';ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#66766b';ctx.stroke()}
function drawEasel(x,y){ctx.strokeStyle='#826c50';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y-45);ctx.lineTo(x-24,y+35);ctx.moveTo(x,y-45);ctx.lineTo(x+24,y+35);ctx.moveTo(x,y-45);ctx.lineTo(x,y+38);ctx.stroke();ctx.fillStyle='#c5bda2';ctx.fillRect(x-31,y-55,62,48);ctx.fillStyle='#667a69';ctx.fillRect(x-23,y-45,45,29);ctx.fillStyle='#b17b56';ctx.beginPath();ctx.arc(x-5,y-32,8,0,Math.PI*2);ctx.fill()}
function drawStatue(x,y){ctx.fillStyle='#8a8d7b';ctx.beginPath();ctx.ellipse(x,y,22,40,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b6b49e';ctx.beginPath();ctx.arc(x,y-37,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333a34';ctx.fillRect(x-5,y-39,3,3);ctx.fillRect(x+5,y-39,3,3)}
function drawBench(x,y){ctx.fillStyle='#725b43';ctx.fillRect(x-45,y-10,90,18);ctx.fillStyle='#343e39';ctx.fillRect(x-35,y+8,7,18);ctx.fillRect(x+28,y+8,7,18)}
function drawPipe(x,y){ctx.fillStyle='#64766b';ctx.fillRect(x-7,y,14,250);ctx.fillStyle='#9ca99a';ctx.fillRect(x-11,y+10,22,8);ctx.fillRect(x-11,y+180,22,8)}
function drawDoor(d){let vertical=d.x<150||d.x>810;ctx.fillStyle='#171e1b';if(vertical)ctx.fillRect(d.x-5,d.y-52,20,104);else ctx.fillRect(d.x-52,d.y-7,104,20);ctx.fillStyle='#735d46';if(vertical)ctx.fillRect(d.x-4,d.y-47,16,94);else ctx.fillRect(d.x-47,d.y-4,94,16);ctx.fillStyle='#c2b18b';ctx.beginPath();ctx.arc(vertical?d.x+7:d.x+34,vertical?d.y+25:d.y+4,3,0,Math.PI*2);ctx.fill()}
function drawItem(){let key=rooms[roomId].item;if(!key||found[key])return;let p=itemPos[roomId];if(!p)return;ctx.save();ctx.shadowColor='#d8e7ad';ctx.shadowBlur=15;ctx.fillStyle=key==='key'?'#d2b56d':key==='fuse'?'#a8d4d2':'#d8d6bc';ctx.fillRect(p[0]-9,p[1]-9,18,18);ctx.restore();ctx.fillStyle='#17201b';ctx.fillRect(p[0]-4,p[1]-4,8,8)}
function drawPlayer(){let x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,12,15,7,0,0,Math.PI*2);ctx.fill(); // shoes
 ctx.fillStyle='#202b2c';ctx.fillRect(-11,5,8,8);ctx.fillRect(3,5,8,8);
 // uniform body and backpack
 ctx.fillStyle='#263b40';ctx.fillRect(-12,-12,24,22);ctx.fillStyle='#536d70';ctx.fillRect(-10,-10,20,17);ctx.fillStyle='#8e9b91';ctx.fillRect(-3,-9,6,13);ctx.fillStyle='#754f3d';ctx.fillRect(8,-8,7,14);ctx.fillStyle='#a17b55';ctx.fillRect(10,-4,3,5);
 // head, hair, face
 ctx.fillStyle='#d0ad8c';ctx.fillRect(-8,-27,16,16);ctx.fillStyle='#252b2a';ctx.fillRect(-10,-30,20,9);ctx.fillRect(-11,-25,5,11);ctx.fillRect(6,-24,5,10);ctx.fillStyle='#202c2b';ctx.fillRect(-5,-20,2,2);ctx.fillRect(4,-20,2,2);ctx.fillStyle='#b98c70';ctx.fillRect(-2,-15,5,2);
 // collar and limbs
 ctx.fillStyle='#e0e3d4';ctx.fillRect(-5,-11,10,4);ctx.fillStyle='#b99575';ctx.fillRect(-14,-7,4,10);ctx.fillRect(10,-7,4,10);
 ctx.restore();
}
function drawNoise(){if(!enemy)return;let d=Math.hypot(player.x-enemy.x,player.y-enemy.y);let visible=d<130||(light&&d<250&&Math.random()>.12)||enemy.alert>.5;if(!visible)return;let x=enemy.x,y=enemy.y;ctx.save();ctx.globalAlpha=Math.min(.95,.45+enemy.alert*.5);ctx.shadowColor='#d6e2db';ctx.shadowBlur=12;ctx.strokeStyle='#101515';ctx.lineWidth=5;for(let i=0;i<9;i++){let a=i*2.3+enemy.phase;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*4,y-35+Math.sin(a)*5);ctx.bezierCurveTo(x+Math.sin(a*2)*35,y-10,x+Math.cos(a*1.4)*28,y+20,x+Math.sin(a)*10,y+39);ctx.stroke()}ctx.fillStyle='#111716';ctx.beginPath();ctx.ellipse(x,y-23,12,16,.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dce8dd';ctx.fillRect(x-5,y-26,3,3);ctx.fillRect(x+3,y-26,3,3);ctx.restore();}
function darkness(){let px=player.x,py=player.y;ctx.save();ctx.fillStyle='rgba(0,0,0,.93)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='destination-out';
 // Reveal only current room interior around player; walls and outside room remain dark.
 let grad=ctx.createRadialGradient(px,py,25,px,py,light?240:125);grad.addColorStop(0,'rgba(0,0,0,1)');grad.addColorStop(.55,'rgba(0,0,0,.88)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,light?240:125,0,Math.PI*2);ctx.fill();
 // room's ambient dim visibility
 ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
 // flashlight cone
 if(light&&battery>0){ctx.globalCompositeOperation='destination-out';let a=player.dir;let cone=ctx.createRadialGradient(px,py,10,px+Math.cos(a)*175,py+Math.sin(a)*175,210);cone.addColorStop(0,'rgba(0,0,0,.95)');cone.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=cone;ctx.beginPath();ctx.moveTo(px,py);ctx.arc(px,py,240,a-.48,a+.48);ctx.closePath();ctx.fill();}
 ctx.restore();
}
function render(){ctx.clearRect(0,0,W,H);drawFloor();drawItem();drawNoise();drawPlayer();darkness();if(scare>0){ctx.fillStyle=`rgba(220,235,225,${scare*.24})`;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dbe8dd';ctx.font='bold 24px monospace';ctx.fillText('SIGNAL LOST',W/2-85,H/2)}if(doorFlash>0){ctx.fillStyle=`rgba(220,240,225,${doorFlash*.4})`;ctx.fillRect(0,0,W,H)}}
function blocked(x,y){return x<130||x>830||y<95||y>505}
function nearestDoor(){let best=null,dist=1e9;for(let d of rooms[roomId].doors){let n=Math.hypot(player.x-d.x,player.y-d.y);if(n<dist){dist=n;best=d}}return dist<72?best:null}
function interact(){if(state!=='play')return;let room=rooms[roomId],key=room.item,p=itemPos[roomId];if(key&&!found[key]&&p&&Math.hypot(player.x-p[0],player.y-p[1])<65){found[key]=true;let msg={note:'メモ：「理科室の予備電源を入れ、図書室の記録を探せ」',fuse:'予備ヒューズを入手。図書室を調べよう。',key:'古い鍵を入手。音楽室の奥へ進めそうだ。',record:'放送記録：「美術室の札が地下扉を開く」',seal:'地下扉の札を入手。体育館の地下階段へ。',memory:'最後の記録：「チャイムが鳴る前に、非常口へ」'};toast(msg[key]);status();return;}
 let d=nearestDoor();if(d){if(d.to==='science'&&!found.note){toast('メモの手がかりを先に確認しよう');return}if(d.to==='library'&&!found.fuse){toast('理科室の電源を確認してから進もう');return}if(d.to==='music'&&!found.key){toast('図書室の鍵が必要だ');return}if(d.to==='art'&&!found.record){toast('音楽室の放送記録を探そう');return}if(d.to==='gym'&&!found.seal){toast('地下扉の札を探す必要がある');return}if(d.to==='basement'&&!found.seal){toast('地下へ続く扉は固く閉ざされている');return}if(d.to==='exit'){if(found.memory){ending='脱出';finish();return}else{toast('非常口の向こうに何かが足りない。地下の記録を探そう');return}}enter(d.to,d.x<200?'left':d.x>800?'right':d.y<150?'up':'down');return;}
 toast('近くに調べられるものはない。部屋の中を探そう。');
}
function finish(){state='end';$('overlay').style.display='flex';$('panel').innerHTML=`<div class="kicker">ENDING</div><h2>${ending}</h2><p>最後のチャイムが止まり、校舎に朝の光が差し込んだ。<br>あなたは校門の外へ出た。</p><div class="actions"><button id="again">もう一度プレイ</button></div>`;$('again').onclick=()=>location.reload();}
function fail(){state='end';ending='見つかった';$('overlay').style.display='flex';$('panel').innerHTML=`<div class="kicker">ENDING</div><h2>見つかった</h2><p>暗闇の中で、ノイズの気配がすぐそばまで迫っていた。<br>足音を止め、部屋を変えることも考えよう。</p><div class="actions"><button id="again">もう一度プレイ</button></div>`;$('again').onclick=()=>location.reload();}
function update(dt){if(state!=='play')return;elapsed+=dt;toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;doorFlash=Math.max(0,doorFlash-dt);scare=Math.max(0,scare-dt);noiseCooldown-=dt;
 let dx=0,dy=0; if(keys.ArrowLeft||keys.a||touch.ArrowLeft)dx--;if(keys.ArrowRight||keys.d||touch.ArrowRight)dx++;if(keys.ArrowUp||keys.w||touch.ArrowUp)dy--;if(keys.ArrowDown||keys.s||touch.ArrowDown)dy++;
 let moving=dx||dy,run=(keys.Shift||touch.run)&&stamina>0,speed=run?190:118;if(moving){let len=Math.hypot(dx,dy);dx/=len;dy/=len;player.x+=dx*speed*dt;player.y+=dy*speed*dt;player.dir=Math.atan2(dy,dx);player.walk+=dt*(run?13:8);stamina=Math.max(0,stamina-(run?28:0)*dt);if(run)noise=Math.max(noise,.85);else noise=Math.max(noise,.28)}else stamina=Math.min(100,stamina+18*dt);
 player.x=Math.max(130,Math.min(830,player.x));player.y=Math.max(95,Math.min(505,player.y));
 if(touch.light||keys.f){light=!light;touch.light=false;keys.f=false;toast(light?'ライトを点灯':'ライトを消灯');}
 if(light)battery=Math.max(0,battery-1.25*dt);if(battery<=0)light=false;
 // enemy moves mostly out of view, then investigates running/noise.
 let d=Math.hypot(player.x-enemy.x,player.y-enemy.y);enemy.phase+=dt;
 if(noise>.15&&d<330){enemy.alert=Math.min(1,enemy.alert+dt*.48);enemy.mode='search'}
 if(d<115){enemy.alert=Math.min(1,enemy.alert+dt*.65);enemy.mode='hunt'}
 if(enemy.alert>.18){let vx=player.x-enemy.x,vy=player.y-enemy.y,l=Math.hypot(vx,vy)||1;let sp=enemy.mode==='hunt'?86:60;enemy.x+=vx/l*sp*dt;enemy.y+=vy/l*sp*dt;}else{enemy.x+=Math.cos(enemy.phase*.6)*14*dt;enemy.y+=Math.sin(enemy.phase*.8)*13*dt}
 enemy.x=Math.max(140,Math.min(820,enemy.x));enemy.y=Math.max(110,Math.min(490,enemy.y));enemy.alert=Math.max(0,enemy.alert-dt*.08);noise=Math.max(0,noise-dt*.8);
 if(d<24){fail();return}
 if(Math.random()<dt*.018&&d>190){scare=.35;toast(['廊下の奥で椅子が倒れた','誰もいない部屋からピアノの音がした','背後で扉が閉まる音がした'][Math.floor(Math.random()*3)])}
 status();
}
let last=0;function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='f')keys.f=true;if(e.key.toLowerCase()==='m')toast($('objective').textContent);});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,e=>{touch[k]=false}))});
document.querySelectorAll('[data-action]').forEach(b=>{let a=b.dataset.action;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='interact')interact();else if(a==='light')touch.light=true;else if(a==='map')toast($('objective').textContent);else if(a==='run')touch.run=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(a==='run')touch.run=false}))});
canvas.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
status();
})();
</script>
